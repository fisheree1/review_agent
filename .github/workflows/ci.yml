name: Focused quality checks

on:
  pull_request:
    paths:
      - "app/**"
      - "migrations/**"
      - "scripts/**"
      - "tests/**"
      - "evals/**"
      - "pyproject.toml"
      - "alembic.ini"
      - "uv.lock"
      - "web/**"
      - "Dockerfile.web"
      - "Dockerfile.edge"
      - "compose.production.yaml"
      - "deploy/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "migrations/**"
      - "scripts/**"
      - "tests/**"
      - "evals/**"
      - "pyproject.toml"
      - "alembic.ini"
      - "uv.lock"
      - "web/**"
      - "Dockerfile.web"
      - "Dockerfile.edge"
      - "compose.production.yaml"
      - "deploy/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create ephemeral local configuration
        run: python3 scripts/init_local_env.py

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Audit locked Python dependencies
        run: uv audit --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check application and database operations
        run: uv run mypy app scripts migrations

      - name: Test important behavior
        run: uv run pytest -q

      - name: Validate versioned Agent evaluation fixtures
        run: uv run python -m scripts.evaluate_agent

  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Enable locked pnpm version
        run: corepack enable

      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production web dependencies
        run: pnpm audit --prod --audit-level high

      - name: Type-check web application
        run: pnpm typecheck

      - name: Test accessible reader behavior
        run: pnpm test

      - name: Build web application
        env:
          LOCAL_API_TOKEN: ci-placeholder
        run: pnpm build
