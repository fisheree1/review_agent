name: Container smoke test

on:
  pull_request:
    paths:
      - "app/**"
      - "docker/**"
      - "migrations/**"
      - "Dockerfile"
      - "Dockerfile.web"
      - "Dockerfile.edge"
      - "alembic.ini"
      - "compose.yaml"
      - "compose.production.yaml"
      - "compose.override.yaml"
      - "deploy/**"
      - "pyproject.toml"
      - "scripts/**"
      - "uv.lock"
      - "web/**"
      - ".github/workflows/container-smoke.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "docker/**"
      - "migrations/**"
      - "Dockerfile"
      - "Dockerfile.web"
      - "Dockerfile.edge"
      - "alembic.ini"
      - "compose.yaml"
      - "compose.production.yaml"
      - "compose.override.yaml"
      - "deploy/**"
      - "pyproject.toml"
      - "scripts/**"
      - "uv.lock"
      - "web/**"
      - ".github/workflows/container-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create ephemeral local configuration
        run: python3 scripts/init_local_env.py

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Validate isolated production configuration
        run: |
          mkdir -p "$RUNNER_TEMP/review-agent-prod-secrets"
          for name in postgres_admin_password postgres_migrator_password postgres_runtime_password \
            storage_admin_access_key storage_admin_secret_key storage_access_key storage_secret_key \
            deepseek_api_key dashscope_api_key dashscope_embedding_url redis_password redis_acl; do
            printf 'ci-placeholder' > "$RUNNER_TEMP/review-agent-prod-secrets/$name"
          done
          PUBLIC_DOMAIN=study.example.org PROD_SECRETS_DIR="$RUNNER_TEMP/review-agent-prod-secrets" \
            docker compose -f compose.production.yaml config --quiet
          PUBLIC_DOMAIN=study.example.org PROD_SECRETS_DIR="$RUNNER_TEMP/review-agent-prod-secrets" \
            docker compose -f compose.production.yaml config --format json \
              | jq -e '[.services | to_entries[] | select(.value.ports != null) | .key] == ["edge"]'

      - name: Build production HTTPS and static frontend image
        env:
          PUBLIC_DOMAIN: study.example.org
          PROD_SECRETS_DIR: ${{ runner.temp }}/review-agent-prod-secrets
        run: docker compose -f compose.production.yaml build edge

      - name: Verify network exposure policy
        run: |
          docker compose config --format json \
            | jq -e '.services.api.ports[0].host_ip == "127.0.0.1" and .services.web.ports[0].host_ip == "127.0.0.1" and .services.db.ports[0].host_ip == "127.0.0.1" and .services.minio.ports[0].host_ip == "127.0.0.1"'
          docker compose -f compose.yaml config --format json \
            | jq -e '(.services.db.ports // []) | length == 0'

      - name: Start application stack
        run: docker compose up --build --wait --wait-timeout 120 -d

      - name: Verify API, web, and database readiness
        run: |
          curl --fail --silent --show-error http://localhost:8000/health/ready
          curl --fail --silent --show-error http://localhost:5173/

      - name: Verify migration idempotency and runtime privileges
        run: |
          docker compose run --rm database-init
          docker compose run --rm database-init python -m scripts.verify_document_tenant_constraints
          docker compose exec -T api python -m scripts.verify_runtime_database_access
          docker compose exec -T api python -m scripts.verify_storage_access
          docker compose exec -T api python -m scripts.verify_redis_rate_limit

      - name: Verify private PDF lifecycle
        run: docker compose exec -T api python -m scripts.verify_document_flow --base-url http://localhost:8000

      - name: Verify cited retrieval isolation and recovery without cloud requests
        run: |
          docker compose stop worker
          docker compose exec -T api python -m scripts.verify_rag_flow

      - name: Verify conversation tasks, Quiz, cancellation and ownership without cloud requests
        run: docker compose exec -T api python -m scripts.verify_learning_flow

      - name: Verify prior-schema upgrade preserves learning records
        run: |
          docker compose exec -T db psql -U review_agent_admin -d review_agent -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE review_agent_migration_check'
          docker compose exec -T db psql -U review_agent_admin -d review_agent_migration_check -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION vector'
          docker compose run --rm -e POSTGRES_DB=review_agent_migration_check database-init \
            python -m scripts.verify_quiz_agent_migration --isolated

      - name: Show logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application stack
        if: always()
        run: docker compose down --volumes
