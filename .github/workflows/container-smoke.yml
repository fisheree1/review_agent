name: Container smoke test

on:
  pull_request:
    paths:
      - "app/**"
      - "docker/**"
      - "Dockerfile"
      - "compose.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/container-smoke.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "docker/**"
      - "Dockerfile"
      - "compose.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/container-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start application stack
        run: docker compose up --build --wait --wait-timeout 120 -d

      - name: Verify API and database readiness
        run: curl --fail --silent --show-error http://localhost:8000/health/ready

      - name: Show logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application stack
        if: always()
        run: docker compose down --volumes
