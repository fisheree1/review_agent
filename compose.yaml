services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: review-agent-web:${APP_IMAGE_TAG:-local}
    environment:
      API_PROXY_TARGET: http://api:8000
      LOCAL_API_TOKEN: ${LOCAL_API_TOKEN:?Run python3 scripts/init_local_env.py or scripts/upgrade_local_env.py first}
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /app/web/node_modules/.vite-temp:rw,noexec,nosuid,size=4m,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    build:
      context: .
    image: review-agent:${APP_IMAGE_TAG:-local}
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-review_agent}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-review_agent_app}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Run python3 scripts/init_local_env.py or scripts/upgrade_local_env.py first}
      LOCAL_API_TOKEN: ${LOCAL_API_TOKEN:?Run python3 scripts/init_local_env.py or scripts/upgrade_local_env.py first}
      LOCAL_WORKSPACE_ID: ${LOCAL_WORKSPACE_ID:?Run python3 scripts/init_local_env.py or scripts/upgrade_local_env.py first}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      WORKER_HEALTH_STALE_SECONDS: ${WORKER_HEALTH_STALE_SECONDS:-30}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-4}
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Run python3 scripts/init_local_env.py or scripts/upgrade_local_env.py first}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Run python3 scripts/init_local_env.py or scripts/upgrade_local_env.py first}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-review-agent-documents}
      STORAGE_SECURE: "false"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      database-init:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  worker:
    build:
      context: .
    image: review-agent:${APP_IMAGE_TAG:-local}
    command: ["python", "-m", "app.jobs.worker"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-review_agent}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-review_agent_app}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Run python3 scripts/init_local_env.py or scripts/upgrade_local_env.py first}
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Run python3 scripts/init_local_env.py or scripts/upgrade_local_env.py first}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Run python3 scripts/init_local_env.py or scripts/upgrade_local_env.py first}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-review-agent-documents}
      STORAGE_SECURE: "false"
      JOB_POLL_SECONDS: ${JOB_POLL_SECONDS:-1}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-120}
      PDF_PARSER_TIMEOUT_SECONDS: ${PDF_PARSER_TIMEOUT_SECONDS:-60}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-500}
      MAX_PDF_CHARACTERS: ${MAX_PDF_CHARACTERS:-5000000}
      OFFICE_PARSER_TIMEOUT_SECONDS: ${OFFICE_PARSER_TIMEOUT_SECONDS:-60}
      MAX_OFFICE_UNITS: ${MAX_OFFICE_UNITS:-1000}
      MAX_OFFICE_CHARACTERS: ${MAX_OFFICE_CHARACTERS:-5000000}
      MAX_OFFICE_UNCOMPRESSED_BYTES: ${MAX_OFFICE_UNCOMPRESSED_BYTES:-104857600}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-5}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-4}
    depends_on:
      database-init:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://api:8000/health/worker')"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    mem_limit: 768m
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  database-init:
    build:
      context: .
    image: review-agent:${APP_IMAGE_TAG:-local}
    command: ["python", "-m", "scripts.initialize_database"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-review_agent}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-review_agent_admin}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run python3 scripts/init_local_env.py or scripts/upgrade_local_env.py first}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:-review_agent_migrator}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Run python3 scripts/init_local_env.py or scripts/upgrade_local_env.py first}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-review_agent_app}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Run python3 scripts/init_local_env.py or scripts/upgrade_local_env.py first}
    depends_on:
      db:
        condition: service_healthy
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  storage-init:
    build:
      context: .
    image: review-agent:${APP_IMAGE_TAG:-local}
    command: ["python", "-m", "scripts.initialize_storage"]
    environment:
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ADMIN_ACCESS_KEY: ${STORAGE_ADMIN_ACCESS_KEY:?Run python3 scripts/init_local_env.py or scripts/upgrade_local_env.py first}
      STORAGE_ADMIN_SECRET_KEY: ${STORAGE_ADMIN_SECRET_KEY:?Run python3 scripts/init_local_env.py or scripts/upgrade_local_env.py first}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Run python3 scripts/init_local_env.py or scripts/upgrade_local_env.py first}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Run python3 scripts/init_local_env.py or scripts/upgrade_local_env.py first}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-review-agent-documents}
      STORAGE_SECURE: "false"
    depends_on:
      minio:
        condition: service_started
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-review_agent}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-review_agent_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run python3 scripts/init_local_env.py or scripts/upgrade_local_env.py first}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ADMIN_ACCESS_KEY:?Run python3 scripts/init_local_env.py or scripts/upgrade_local_env.py first}
      MINIO_ROOT_PASSWORD: ${STORAGE_ADMIN_SECRET_KEY:?Run python3 scripts/init_local_env.py or scripts/upgrade_local_env.py first}
    expose:
      - "9000"
    volumes:
      - minio_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
