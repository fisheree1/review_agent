services:
  db:
    # Local database tools can connect through loopback. Production must use
    # only compose.yaml, which does not publish the PostgreSQL port.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
  minio:
    # Local inspection only. Production keeps the private object API internal.
    ports:
      - "127.0.0.1:${STORAGE_PORT:-9000}:9000"
