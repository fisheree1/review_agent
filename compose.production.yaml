name: review-agent-prod

services:
  edge:
    build:
      context: .
      dockerfile: Dockerfile.edge
    image: review-agent-edge:${APP_IMAGE_TAG:-local}
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN to the public DNS name}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  api:
    build:
      context: .
    image: review-agent:${APP_IMAGE_TAG:-local}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      APP_ENV: production
      AUTH_PUBLIC_ORIGIN: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
      AUTH_ALLOW_SIGNUP: "false"
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-review_agent}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-review_agent_app}
      STORAGE_ENDPOINT: minio:9000
      STORAGE_BUCKET: ${STORAGE_BUCKET:-review-agent-documents}
      STORAGE_SECURE: "false"
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      WORKER_HEALTH_STALE_SECONDS: ${WORKER_HEALTH_STALE_SECONDS:-30}
    secrets:
      - postgres_runtime_password
      - storage_access_key
      - storage_secret_key
      - redis_password
    expose: ["8000"]
    depends_on:
      database-init:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  worker:
    image: review-agent:${APP_IMAGE_TAG:-local}
    command: ["python", "-m", "app.jobs.worker"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-review_agent}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-review_agent_app}
      STORAGE_ENDPOINT: minio:9000
      STORAGE_BUCKET: ${STORAGE_BUCKET:-review-agent-documents}
      STORAGE_SECURE: "false"
      JOB_POLL_SECONDS: ${JOB_POLL_SECONDS:-1}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-120}
      PDF_PARSER_TIMEOUT_SECONDS: ${PDF_PARSER_TIMEOUT_SECONDS:-300}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-500}
      MAX_PDF_CHARACTERS: ${MAX_PDF_CHARACTERS:-5000000}
      OFFICE_PARSER_TIMEOUT_SECONDS: ${OFFICE_PARSER_TIMEOUT_SECONDS:-60}
      MAX_OFFICE_UNITS: ${MAX_OFFICE_UNITS:-1000}
      MAX_OFFICE_CHARACTERS: ${MAX_OFFICE_CHARACTERS:-5000000}
      MAX_OFFICE_UNCOMPRESSED_BYTES: ${MAX_OFFICE_UNCOMPRESSED_BYTES:-104857600}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-5}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen3.7-text-embedding}
    secrets:
      - postgres_runtime_password
      - storage_access_key
      - storage_secret_key
      - deepseek_api_key
      - dashscope_api_key
      - dashscope_embedding_url
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://api:8000/health/worker')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    mem_limit: 768m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  database-init:
    build:
      context: .
    image: review-agent:${APP_IMAGE_TAG:-local}
    command: ["python", "-m", "scripts.initialize_database"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-review_agent}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-review_agent_admin}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:-review_agent_migrator}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-review_agent_app}
    secrets:
      - postgres_admin_password
      - postgres_migrator_password
      - postgres_runtime_password
    depends_on:
      db:
        condition: service_healthy
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  storage-init:
    build:
      context: .
    image: review-agent:${APP_IMAGE_TAG:-local}
    command: ["python", "-m", "scripts.initialize_storage"]
    environment:
      STORAGE_ENDPOINT: minio:9000
      STORAGE_BUCKET: ${STORAGE_BUCKET:-review-agent-documents}
      STORAGE_SECURE: "false"
    secrets:
      - storage_admin_access_key
      - storage_admin_secret_key
      - storage_access_key
      - storage_secret_key
    depends_on:
      minio:
        condition: service_started
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-review_agent}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-review_agent_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
    expose: ["5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/storage_admin_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/storage_admin_secret_key
      MINIO_BROWSER: "off"
    secrets:
      - storage_admin_access_key
      - storage_admin_secret_key
    expose: ["9000"]
    volumes:
      - minio_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine
    entrypoint: ["redis-server"]
    command:
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
      - --aclfile
      - /run/secrets/redis_acl
    secrets:
      - redis_password
      - redis_acl
    expose: ["6379"]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    mem_limit: 128m
    pids_limit: 32
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

secrets:
  postgres_admin_password:
    file: ${PROD_SECRETS_DIR:?Set PROD_SECRETS_DIR}/postgres_admin_password
  postgres_migrator_password:
    file: ${PROD_SECRETS_DIR:?Set PROD_SECRETS_DIR}/postgres_migrator_password
  postgres_runtime_password:
    file: ${PROD_SECRETS_DIR:?Set PROD_SECRETS_DIR}/postgres_runtime_password
  storage_admin_access_key:
    file: ${PROD_SECRETS_DIR:?Set PROD_SECRETS_DIR}/storage_admin_access_key
  storage_admin_secret_key:
    file: ${PROD_SECRETS_DIR:?Set PROD_SECRETS_DIR}/storage_admin_secret_key
  storage_access_key:
    file: ${PROD_SECRETS_DIR:?Set PROD_SECRETS_DIR}/storage_access_key
  storage_secret_key:
    file: ${PROD_SECRETS_DIR:?Set PROD_SECRETS_DIR}/storage_secret_key
  deepseek_api_key:
    file: ${PROD_SECRETS_DIR:?Set PROD_SECRETS_DIR}/deepseek_api_key
  dashscope_api_key:
    file: ${PROD_SECRETS_DIR:?Set PROD_SECRETS_DIR}/dashscope_api_key
  dashscope_embedding_url:
    file: ${PROD_SECRETS_DIR:?Set PROD_SECRETS_DIR}/dashscope_embedding_url
  redis_password:
    file: ${PROD_SECRETS_DIR:?Set PROD_SECRETS_DIR}/redis_password
  redis_acl:
    file: ${PROD_SECRETS_DIR:?Set PROD_SECRETS_DIR}/redis_acl

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
